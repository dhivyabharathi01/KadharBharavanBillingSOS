<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#3e182b" />
  <meta property="og:title" content="Pay now" />
  <meta property="og:description" content="Open your UPI app to pay this bill." />
  <title>Pay by UPI</title>
  <style>
    *{box-sizing:border-box}
    body{display:grid;place-items:center;min-height:100vh;margin:0;padding:24px;font:16px 'DM Sans',Arial,sans-serif;color:#30252b;background:radial-gradient(ellipse at 85% 5%,#eadbc7 0,transparent 34%),linear-gradient(140deg,#faf7f1,#f3ece5)}
    main{width:min(440px,100%);margin:auto;padding:clamp(26px,7vw,42px);border:1px solid #e6d8c8;border-top:4px solid #b3915b;border-radius:22px;background:#fffdf9;box-shadow:0 24px 70px rgba(62,24,43,.13)}
    .brand{margin:0 0 24px;color:#987244;font-size:10px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase}
    h1{margin:0;color:#3e182b;font-family:Georgia,serif;font-size:30px;font-weight:600;letter-spacing:-.3px}
    #paymentStatus{margin-top:12px;color:#786b6e;line-height:1.6}
    #paymentDetails{margin:20px 0;padding:16px;border:1px solid #eadfce;border-radius:12px;background:#faf5ec;color:#3e182b;font-size:18px;font-weight:700;line-height:1.6}
    .pay-button{display:block;margin:24px 0;padding:16px;border:1px solid #76503a;border-radius:12px;background:linear-gradient(135deg,#633047,#3e182b);color:#fff;text-align:center;text-decoration:none;font-weight:700;box-shadow:0 8px 18px rgba(62,24,43,.18)}
    .pay-button:hover{background:linear-gradient(135deg,#754058,#51243a)}
    .fine-print{margin:18px 0 0;color:#84777b;font-size:12px;line-height:1.6}
  </style>
</head>
<body>
  <main>
    <p class="brand">Nesavu · Textile Business Suite</p>
    <h1>Pay by UPI</h1>
    <p id="paymentStatus">Preparing secure payment link…</p>
    <p id="paymentDetails"></p>
    <a id="payNow" class="pay-button" href="#" hidden>Pay now</a>
    <p class="fine-print">Check the shop name and amount in your UPI app before confirming payment.</p>
  </main>
  <script src="./upi-pay.js" defer></script>
</body>
</html>
